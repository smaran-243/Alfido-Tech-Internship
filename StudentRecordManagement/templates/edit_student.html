{% extends "base.html" %}

{% block title %}Edit Student - Student Record Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <!-- Back Button -->
        <div class="mb-3">
            <a href="{{ url_for('student_details', id=student.id) }}" class="text-decoration-none text-primary fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Details
            </a>
        </div>
        
        <!-- Edit Form Card -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-warning text-dark py-3 border-0">
                <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Student Record</h4>
                <p class="mb-0 text-muted small">Update student profile details. All edits will save to the database.</p>
            </div>
            
            <div class="card-body p-4 bg-white">
                <form action="{{ url_for('edit_student', id=student.id) }}" method="POST" class="needs-validation" novalidate>
                    
                    <div class="row g-3">
                        <!-- 1. Full Name -->
                        <div class="col-md-6 col-12">
                            <label for="name" class="form-label fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
                                <input type="text" class="form-control bg-light" id="name" name="name" placeholder="John Doe" value="{{ student.name }}" required>
                            </div>
                        </div>

                        <!-- 2. Roll Number -->
                        <div class="col-md-6 col-12">
                            <label for="roll_number" class="form-label fw-semibold text-secondary">Roll Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-hash text-muted"></i></span>
                                <input type="text" class="form-control bg-light" id="roll_number" name="roll_number" placeholder="CS202601" value="{{ student.roll_number }}" required>
                            </div>
                        </div>

                        <!-- 3. Department (Selected conditionally) -->
                        <div class="col-md-6 col-12">
                            <label for="department" class="form-label fw-semibold text-secondary">Department <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-building text-muted"></i></span>
                                <select class="form-select bg-light" id="department" name="department" required>
                                    <option value="" disabled>Select Department</option>
                                    <option value="Computer Science" {% if student.department == "Computer Science" %}selected{% endif %}>Computer Science</option>
                                    <option value="Electrical Engineering" {% if student.department == "Electrical Engineering" %}selected{% endif %}>Electrical Engineering</option>
                                    <option value="Mechanical Engineering" {% if student.department == "Mechanical Engineering" %}selected{% endif %}>Mechanical Engineering</option>
                                    <option value="Civil Engineering" {% if student.department == "Civil Engineering" %}selected{% endif %}>Civil Engineering</option>
                                    <option value="Information Technology" {% if student.department == "Information Technology" %}selected{% endif %}>Information Technology</option>
                                    <option value="Business Administration" {% if student.department == "Business Administration" %}selected{% endif %}>Business Administration</option>
                                </select>
                            </div>
                        </div>

                        <!-- 4. Academic Year (Selected conditionally) -->
                        <div class="col-md-6 col-12">
                            <label for="year" class="form-label fw-semibold text-secondary">Academic Year <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-calendar-event text-muted"></i></span>
                                <select class="form-select bg-light" id="year" name="year" required>
                                    <option value="" disabled>Select Year</option>
                                    <option value="1" {% if student.year == 1 %}selected{% endif %}>1st Year (Freshman)</option>
                                    <option value="2" {% if student.year == 2 %}selected{% endif %}>2nd Year (Sophomore)</option>
                                    <option value="3" {% if student.year == 3 %}selected{% endif %}>3rd Year (Junior)</option>
                                    <option value="4" {% if student.year == 4 %}selected{% endif %}>4th Year (Senior)</option>
                                </select>
                            </div>
                        </div>

                        <!-- 5. Email Address -->
                        <div class="col-md-6 col-12">
                            <label for="email" class="form-label fw-semibold text-secondary">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope-fill text-muted"></i></span>
                                <input type="email" class="form-control bg-light" id="email" name="email" placeholder="student@college.edu" value="{{ student.email }}" required>
                            </div>
                        </div>

                        <!-- 6. Phone Number -->
                        <div class="col-md-6 col-12">
                            <label for="phone" class="form-label fw-semibold text-secondary">Phone Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone-fill text-muted"></i></span>
                                <input type="text" class="form-control bg-light" id="phone" name="phone" placeholder="9876543210" value="{{ student.phone }}" required>
                            </div>
                        </div>

                        <!-- 7. CGPA -->
                        <div class="col-md-12 col-12">
                            <label for="cgpa" class="form-label fw-semibold text-secondary">CGPA (Scale: 0.0 - 10.0) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-percent text-muted"></i></span>
                                <input type="number" class="form-control bg-light" id="cgpa" name="cgpa" placeholder="8.5" min="0.0" max="10.0" step="0.01" value="{{ student.cgpa }}" required>
                            </div>
                        </div>

                        <!-- 8. Address -->
                        <div class="col-12">
                            <label for="address" class="form-label fw-semibold text-secondary">Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-geo-alt-fill text-muted"></i></span>
                                <textarea class="form-control bg-light" id="address" name="address" rows="3" placeholder="Enter student's permanent address..." required>{{ student.address }}</textarea>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('student_details', id=student.id) }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4 shadow-sm fw-semibold">
                            <i class="bi bi-check-circle-fill me-1"></i>Save Changes
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Simple Bootstrap 5 front-end form validation script
(function () {
  'use strict'
  var forms = document.querySelectorAll('.needs-validation')
  Array.prototype.slice.call(forms)
    .forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }
        form.classList.add('was-validated')
      }, false)
    })
})()
</script>
{% endblock %}
